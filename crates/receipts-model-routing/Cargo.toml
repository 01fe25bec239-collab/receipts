[package]
name = "receipts-model-routing"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"

[lib]
path = "../../src/routing/lib.rs"

[dependencies]
receipts-state = { path = "../.." }
receipts-runtime-adapters = { path = "../receipts-runtime-adapters" }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "raw_value"] }
sha2 = "=0.11.0"
