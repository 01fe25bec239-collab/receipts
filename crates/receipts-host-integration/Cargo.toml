# BUILD-A3 host-integration slice manifest (BUILD-A1 temporary Cargo authority).
# Bounded Host observation parsing substrate; no worker/runtime dependencies.
[package]
name = "receipts-host-integration"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# Product source for this task lives under src/hosts/** only; the lib target
# is pointed there so no crate topology is defined for other managers.
[lib]
path = "../../src/hosts/lib.rs"

[dependencies]
receipts-orchestration = { path = "../receipts-orchestration" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = { version = "=1.1.5", default-features = false, features = ["parse", "serde", "std"] }
