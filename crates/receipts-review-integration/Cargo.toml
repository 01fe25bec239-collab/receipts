[package]
name = "receipts-review-integration"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"

[lib]
path = "../../src/review/lib.rs"

[dependencies]
receipts-review-contracts = { path = "../receipts-review-contracts" }
receipts-runtime-adapters = { path = "../receipts-runtime-adapters" }
receipts-state = { path = "../.." }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
receipts-workspace-execution = { path = "../receipts-workspace-execution" }
