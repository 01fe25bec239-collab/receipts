[package]
name = "receipts-orchestration"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
path = "../../src/core/lib.rs"

[dependencies]
receipts-state = { path = "../.." }
receipts-workspace-execution = { path = "../receipts-workspace-execution" }
sha2 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
jsonschema = { version = "=0.58.6", default-features = false }
