# BUILD-A3 task bootstrap manifest (BUILD-A1-approved substrate only).
# Rust 1.97.1 stable, edition 2024, rusqlite 0.41.0 + bundled SQLite, Tokio ~1.51.
[package]
name = "receipts-state"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"

# Product source for this task lives under src/state/** only; the lib target
# is pointed there so no crate topology is defined for other managers.
[lib]
path = "src/state/lib.rs"

[workspace]
members = [
    "crates/receipts-orchestration",
    "crates/receipts-runtime-adapters",
    "crates/receipts-workspace-execution",
    "crates/receipts-host-integration",
    "crates/receipts-model-routing",
    "crates/receipts-review-integration",
    "crates/receipts-review-contracts",
    "crates/receipts-e2e",
    "crates/receipts-cli",
    "crates/receipts-runtime-bindings",
]

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false }
base64 = { version = "=0.23.1", default-features = false }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "raw_value"] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.11.0"
# Narrow secure-open primitives (openat/fstatat/flock) for the trusted-core
# State writer; already locked, no default features.
libc = { version = "=0.2.189", default-features = false }
# Approved async substrate for later State/Context milestones; this foundation
# slice is synchronous, so no Tokio features are enabled yet.
tokio = { version = "~1.51", default-features = false }

[dev-dependencies]
jsonschema = { version = "=0.58.6", default-features = false }
