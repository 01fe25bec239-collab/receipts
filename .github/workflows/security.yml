name: Security scan

# Automatic adopted Q-06 components (cargo-audit, Gitleaks) plus workflow
# lint, on every PR and on main. Read-only token, no secrets, no
# pull_request_target, no writes. New jobs are advisory until A1 adds them
# to branch protection; nothing here flips that on a timer. Any tool,
# control, dataset, timeout or cleanup failure fails the job.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  security-scan:
    name: security-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI_TESTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CI_TESTED_SHA }}
          persist-credentials: false

      - name: Verify commit provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CI_TESTED_SHA}"

      - name: Acquire pinned tools and advisory dataset
        run: .github/scripts/security/acquire.sh "${RUNNER_TEMP}/security"

      - name: Negative controls and scans
        run: .github/scripts/security/run.sh "${RUNNER_TEMP}/security" "${GITHUB_WORKSPACE}"
